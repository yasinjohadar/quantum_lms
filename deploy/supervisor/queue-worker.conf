; Supervisor — Laravel Queue Worker (يعالج CreateBackupJob وبقية الطابور)
; انسخ إلى: /etc/supervisor/conf.d/quantum-lms-queue-worker.conf
; ثم: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start quantum-lms-queue-worker:*
; بعد أي نشر يغيّر كود الـ Jobs يجب إعادة تشغيل العامل ليقرأ الكود الجديد:
;   sudo supervisorctl restart quantum-lms-queue-worker:*

[program:quantum-lms-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/quantum_lms/artisan queue:work --queue=default --sleep=1 --tries=1 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/quantum_lms/storage/logs/queue-worker.log
stopwaitsecs=3660
