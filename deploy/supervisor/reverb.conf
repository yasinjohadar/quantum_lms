; Supervisor — Laravel Reverb (WebSocket)
; انسخ إلى: /etc/supervisor/conf.d/quantum-lms-reverb.conf
; ثم: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start quantum-lms-reverb:*

[program:quantum-lms-reverb]
process_name=%(program_name)s
command=php /var/www/quantum_lms/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/quantum_lms/storage/logs/reverb.log
stopwaitsecs=3600
