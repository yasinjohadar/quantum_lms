; Supervisor — Laravel Scheduler (يشغّل backup:run-scheduled, backup:cleanup-expired,
; backup:reconcile-stuck وبقية المهام المجدولة في routes/console.php كل دقيقة)
; بديل أكثر متانة من الاعتماد على crontab خارجي لا يمكن التحقق منه من داخل المستودع —
; Supervisor يعيد تشغيله تلقائياً إن تعطّل، بعكس سطر cron المنسي.
; انسخ إلى: /etc/supervisor/conf.d/quantum-lms-scheduler.conf
; ثم: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start quantum-lms-scheduler:*

[program:quantum-lms-scheduler]
process_name=%(program_name)s
; numprocs يجب أن تبقى 1 دائماً — تشغيل عمليتين معاً يكرر فحص الجدولة كل دقيقة
; بلا فائدة (الأقفال الداخلية في BackupScheduleService تمنع التكرار الفعلي، لكن لا داعي للتكرار أصلاً)
command=php /var/www/quantum_lms/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/quantum_lms/storage/logs/scheduler.log
stopwaitsecs=10
